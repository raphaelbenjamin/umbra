name: Publish Umbra for macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Umbra release tag"
        required: true
        type: string

concurrency:
  group: umbra-release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'raphaelbenjamin/umbra'
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version and architecture
        run: |
          test "$(uname -m)" = arm64
          test "$RELEASE_TAG" = "v$(node -p "require('./src-tauri/tauri.conf.json').version")"
      - run: npm ci
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UMBRA_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UMBRA_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/umbra-release-assets.mjs src-tauri/target/release/bundle/macos release
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
